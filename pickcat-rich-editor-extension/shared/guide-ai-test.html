<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>测试连接</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      color-scheme: light;
    }

    body.dark { color-scheme: dark; }

    button {
      width: 100%;
      height: 30px;
      padding: 0 10px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #fff;
      color: #1f1f1f;
      font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent, #7c6cf0);
      color: var(--accent, #5b4bd6);
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent, #7c6cf0) 45%, transparent);
      outline-offset: 1px;
    }

    body.dark button {
      border-color: #3a3a3a;
      background: #1b1b1b;
      color: #ededed;
    }

    body.dark button:hover:not(:disabled) {
      border-color: var(--accent, #8f80ff);
      color: var(--accent, #b3a8ff);
    }
  </style>
</head>
<body>
  <button id="test" type="button">测试连接</button>
  <script type="module" src="guide-ai-test.js"></script>
</body>
</html>
