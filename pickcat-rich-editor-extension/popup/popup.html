<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <title>PickScribe</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- ================= AI 总结 ================= -->
  <section class="sec" id="sec-ai">
    <div class="head">
      <span class="logo">AI 总结</span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>

    <div class="row">
      <span class="label">服务商</span>
      <span class="value" id="provider">—</span>
    </div>
    <div class="row">
      <span class="label">模型</span>
      <select id="model" class="model-select"></select>
    </div>

    <p class="tip" id="tip">在 Pickcat 帖子详情页的分隔线下方会显示 AI 总结面板。</p>

    <div class="foot">
      <button id="openOptions" class="btn">AI 设置</button>
    </div>
  </section>

  <!-- ================= 通知中心 ================= -->
  <section class="sec" id="sec-notify">
    <div class="head">
      <span class="logo">通知中心</span>
      <button type="button" class="mini-btn" id="notifyRefresh">刷新</button>
    </div>

    <p class="tip" id="notifyTip">正在读取通知…</p>
    <div class="notice-list" id="notifyList" hidden></div>

    <div class="foot foot-2">
      <button id="openNotifyPage" class="btn">打开通知页</button>
      <button id="openNotifyOptions" class="btn">通知设置</button>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
