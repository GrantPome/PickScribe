<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PickScribe</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="../favorites/console.css" />
</head>
<body>
  <!-- 分区切换：共用同一个扩展图标与弹窗入口，不新增第二个工具栏入口（UI-02 / 4.7） -->
  <nav class="tabs">
    <button class="tab is-on" data-sec="ai">AI 助手</button>
    <button class="tab" data-sec="fav">收藏 Plus</button>
  </nav>

  <!-- ================= 分区一：AI 总结 ================= -->
  <section class="sec" id="sec-ai">
    <div class="head">
      <span class="logo">AI 总结</span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>

    <div class="row">
      <span class="label">服务商</span>
      <span class="value" id="provider">—</span>
    </div>
    <div class="row">
      <span class="label">模型</span>
      <select id="model" class="model-select"></select>
    </div>

    <p class="tip" id="tip">在 Pickcat 帖子详情页的分隔线下方会显示 AI 总结面板。</p>

    <div class="foot">
      <button id="openOptions" class="btn">AI 设置</button>
    </div>
  </section>

  <!-- ================= 分区二：收藏夹 Plus（管理主工作台） ================= -->
  <section class="sec" id="sec-fav" hidden>
    <div class="fav-root" id="favRoot"></div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
